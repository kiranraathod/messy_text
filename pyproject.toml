[project]
name = "messy-text"
version = "0.1.0"
description = "Film production stage classifier for messy, unstructured text"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "groq>=0.25.0",
    "python-dotenv>=1.0",
]

[project.scripts]
messy-text = "messy_text.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/messy_text"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
